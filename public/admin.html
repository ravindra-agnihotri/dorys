<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Dory's Bakehouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --pink: #f472b6; --pink-dark: #db2777; --pink-light: #fce7f3;
      --rose: #fb7185; --cream: #fff8f0;
      --text: #1e1b18; --muted: #6b6560;
      --white: #ffffff; --radius: 14px;
      --shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #f8f4f0; color: var(--text); min-height: 100vh; display: flex; }

    /* SIDEBAR */
    .sidebar {
      width: 240px; min-height: 100vh; background: var(--text);
      display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0;
      z-index: 100; transition: .3s;
    }
    .sidebar-logo {
      padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,.1);
      font-size: 1.1rem; color: white; font-weight: 700;
    }
    .sidebar-logo span { color: var(--pink); }
    .sidebar-nav { padding: 1rem; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: .8rem;
      padding: .75rem 1rem; border-radius: 10px; color: rgba(255,255,255,.7);
      cursor: pointer; margin-bottom: .25rem; font-size: .9rem;
      transition: all .2s; border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: rgba(255,255,255,.08); color: white; }
    .nav-item.active { background: var(--pink-dark); color: white; }
    .nav-item i { width: 20px; font-size: .95rem; }
    .sidebar-footer { padding: 1rem; border-top: 1px solid rgba(255,255,255,.1); }
    .sidebar-footer a { color: #25d366; font-size: .85rem; display: flex; align-items: center; gap: .5rem; }

    /* MAIN */
    .main { margin-left: 240px; flex: 1; padding: 2rem; min-height: 100vh; }

    /* TOPBAR */
    .topbar {
      background: white; border-radius: var(--radius); padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: var(--shadow); margin-bottom: 1.5rem;
    }
    .topbar h1 { font-size: 1.25rem; }
    .visit-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--pink-dark); color: white; padding: .5rem 1rem;
      border-radius: 999px; font-size: .85rem; font-weight: 600; text-decoration: none;
    }

    /* PANELS */
    .panel { display: none; }
    .panel.active { display: block; }

    .panel-section {
      background: white; border-radius: var(--radius); padding: 1.5rem;
      box-shadow: var(--shadow); margin-bottom: 1.5rem;
    }
    .panel-section h2 { font-size: 1.1rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: .5rem; }
    .panel-section h2 i { color: var(--pink-dark); }

    /* FORMS */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: .4rem; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: .82rem; font-weight: 600; color: var(--muted); }
    input[type=text], input[type=number], select, textarea {
      padding: .7rem .9rem; border: 2px solid #f0e0e0; border-radius: 10px;
      font-family: 'Poppins', sans-serif; font-size: .88rem;
      color: var(--text); background: white; transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--pink-dark); }
    textarea { min-height: 90px; resize: vertical; }
    .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: .8rem; }

    .btn { padding: .6rem 1.4rem; border-radius: 999px; font-size: .85rem; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: .4rem; font-family: 'Poppins', sans-serif; transition: all .2s; }
    .btn-pink { background: var(--pink-dark); color: white; }
    .btn-pink:hover { opacity: .9; transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 2px solid #e0d0d0; color: var(--muted); }
    .btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-danger:hover { background: #dc2626; color: white; }

    /* FILE UPLOAD */
    .file-upload {
      border: 2px dashed #f0c0d0; border-radius: 10px; padding: 1.5rem;
      text-align: center; cursor: pointer; transition: .2s; position: relative;
      background: var(--pink-light);
    }
    .file-upload:hover { border-color: var(--pink-dark); }
    .file-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .file-upload i { font-size: 1.5rem; color: var(--pink-dark); margin-bottom: .4rem; }
    .file-upload p { font-size: .82rem; color: var(--muted); }
    .file-preview { margin-top: .6rem; display: flex; gap: .5rem; flex-wrap: wrap; }
    .file-preview img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }

    /* ITEM LISTS */
    .item-list { display: grid; gap: .8rem; }
    .item-row {
      display: flex; align-items: center; gap: 1rem;
      padding: .8rem 1rem; background: var(--cream); border-radius: 10px;
    }
    .item-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; background: var(--pink-light); }
    .item-info { flex: 1; }
    .item-info strong { display: block; font-size: .9rem; }
    .item-info span { font-size: .8rem; color: var(--muted); }

    /* GALLERY GRID (admin) */
    .admin-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .8rem; }
    .admin-gal-item { position: relative; border-radius: 10px; overflow: hidden; }
    .admin-gal-item img { width: 100%; height: 120px; object-fit: cover; }
    .admin-gal-item button {
      position: absolute; top: .3rem; right: .3rem;
      background: rgba(220,38,38,.8); color: white; border: none;
      border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: .7rem;
    }

    /* TOAST */
    #toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 9999;
      background: var(--text); color: white; padding: .8rem 1.4rem;
      border-radius: 999px; font-size: .85rem; transform: translateY(100px);
      opacity: 0; transition: .3s; box-shadow: 0 8px 30px rgba(0,0,0,.2);
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-left: 4px solid #22c55e; }
    #toast.error { border-left: 4px solid #dc2626; }

    @media (max-width: 700px) {
      .sidebar { width: 60px; }
      .sidebar-logo, .nav-item span, .sidebar-footer { display: none; }
      .main { margin-left: 60px; padding: 1rem; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">🎂 <span>Dory's</span> Admin</div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-panel="products"><i class="fas fa-cake-candles"></i> <span>Products</span></button>
    <button class="nav-item" data-panel="gallery"><i class="fas fa-images"></i> <span>Gallery</span></button>
    <button class="nav-item" data-panel="today"><i class="fas fa-star"></i> <span>Today's Special</span></button>
    <button class="nav-item" data-panel="reviews"><i class="fas fa-comments"></i> <span>Reviews</span></button>
    <button class="nav-item" data-panel="flavours"><i class="fas fa-palette"></i> <span>Flavours</span></button>
    <button class="nav-item" data-panel="about"><i class="fas fa-info-circle"></i> <span>About</span></button>
  </nav>
  <div class="sidebar-footer">
    <a href="/" target="_blank"><i class="fas fa-external-link-alt"></i> View Site</a>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <h1 id="panelTitle">Products</h1>
    <a href="/" target="_blank" class="visit-btn"><i class="fas fa-eye"></i> View Site</a>
  </div>

  <!-- PRODUCTS PANEL -->
  <div class="panel active" id="panel-products">
    <div class="panel-section">
      <h2><i class="fas fa-plus-circle"></i> Add New Product</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Name *</label>
          <input type="text" id="pName" placeholder="e.g. Chocolate Truffle">
        </div>
        <div class="form-group">
          <label>Price (₹) *</label>
          <input type="number" id="pPrice" placeholder="599">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="pCategory">
            <option>Birthday</option>
            <option>Wedding</option>
            <option>Anniversary</option>
            <option>Designer</option>
            <option>Cupcakes</option>
            <option>General</option>
          </select>
        </div>
        <div class="form-group">
          <label>Eggless?</label>
          <select id="pEggless">
            <option value="false">No</option>
            <option value="true">Yes (Eggless)</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Description</label>
          <textarea id="pDesc" placeholder="Short description..."></textarea>
        </div>
        <div class="form-group full">
          <label>Photo</label>
          <div class="file-upload">
            <input type="file" id="pImage" accept="image/*">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Click to upload image</p>
          </div>
          <div class="file-preview" id="pPreview"></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-pink" id="addProductBtn"><i class="fas fa-plus"></i> Add Product</button>
        </div>
      </div>
    </div>
    <div class="panel-section">
      <h2><i class="fas fa-list"></i> All Products</h2>
      <div class="item-list" id="productList"><p style="color:var(--muted)">Loading…</p></div>
    </div>
  </div>

  <!-- GALLERY PANEL -->
  <div class="panel" id="panel-gallery">
    <div class="panel-section">
      <h2><i class="fas fa-upload"></i> Upload Photos</h2>
      <div class="file-upload">
        <input type="file" id="galImages" accept="image/*" multiple>
        <i class="fas fa-images"></i>
        <p>Click to upload multiple photos</p>
      </div>
      <div class="file-preview" id="galPreview"></div>
      <br>
      <button class="btn btn-pink" id="uploadGalBtn"><i class="fas fa-cloud-upload-alt"></i> Upload Photos</button>
    </div>
    <div class="panel-section">
      <h2><i class="fas fa-th"></i> Gallery Images</h2>
      <div class="admin-gallery" id="galleryList"></div>
    </div>
  </div>

  <!-- TODAY'S SPECIAL PANEL -->
  <div class="panel" id="panel-today">
    <div class="panel-section">
      <h2><i class="fas fa-star"></i> Set Today's Special</h2>
      <div class="form-grid">
        <div class="form-group"><label>Name *</label><input type="text" id="tName" placeholder="Mango Delight"></div>
        <div class="form-group"><label>Price (₹) *</label><input type="number" id="tPrice"></div>
        <div class="form-group full"><label>Ingredients (comma-separated)</label><input type="text" id="tIngredients" placeholder="Fresh mango, cream, sponge..."></div>
        <div class="form-group full">
          <label>Photo</label>
          <div class="file-upload"><input type="file" id="tImage" accept="image/*"><i class="fas fa-camera"></i><p>Upload photo</p></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-outline" id="clearTodayBtn"><i class="fas fa-trash"></i> Clear</button>
          <button class="btn btn-pink" id="saveTodayBtn"><i class="fas fa-save"></i> Save Special</button>
        </div>
      </div>
      <div id="todayPreview" style="margin-top:1rem;color:var(--muted);font-size:.88rem"></div>
    </div>
  </div>

  <!-- REVIEWS PANEL -->
  <div class="panel" id="panel-reviews">
    <div class="panel-section">
      <h2><i class="fas fa-comments"></i> Customer Reviews</h2>
      <div class="item-list" id="reviewList"><p style="color:var(--muted)">Loading…</p></div>
    </div>
  </div>

  <!-- FLAVOURS PANEL -->
  <div class="panel" id="panel-flavours">
    <div class="panel-section">
      <h2><i class="fas fa-plus-circle"></i> Add Flavour</h2>
      <div class="form-grid">
        <div class="form-group"><label>Name *</label><input type="text" id="fName" placeholder="Strawberry"></div>
        <div class="form-group"><label>Category</label><input type="text" id="fCategory" placeholder="Fruit"></div>
        <div class="form-group"><label>Extra Cost (₹)</label><input type="number" id="fCost" value="0"></div>
        <div class="form-group"><label>Eggless?</label>
          <select id="fEggless"><option value="false">No</option><option value="true">Yes</option></select>
        </div>
        <div class="form-actions"><button class="btn btn-pink" id="addFlavourBtn"><i class="fas fa-plus"></i> Add</button></div>
      </div>
    </div>
    <div class="panel-section">
      <h2><i class="fas fa-list"></i> All Flavours</h2>
      <div class="item-list" id="flavourList"><p style="color:var(--muted)">Loading…</p></div>
    </div>
  </div>

  <!-- ABOUT PANEL -->
  <div class="panel" id="panel-about">
    <div class="panel-section">
      <h2><i class="fas fa-info-circle"></i> Edit About Section</h2>
      <div class="form-grid">
        <div class="form-group full"><label>Title</label><input type="text" id="aTitle"></div>
        <div class="form-group full"><label>Description 1</label><textarea id="aDesc1"></textarea></div>
        <div class="form-group full"><label>Description 2</label><textarea id="aDesc2"></textarea></div>
        <div class="form-actions"><button class="btn btn-pink" id="saveAboutBtn"><i class="fas fa-save"></i> Save</button></div>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
/* ---- Toast ---- */
function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

/* ---- Panel switching ---- */
document.querySelectorAll('.nav-item[data-panel]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    document.getElementById('panelTitle').textContent = btn.querySelector('span')?.textContent || '';
  });
});

/* ---- File preview helper ---- */
function setupPreview(inputId, previewId) {
  document.getElementById(inputId).addEventListener('change', e => {
    const prev = document.getElementById(previewId);
    if (!prev) return;
    prev.innerHTML = '';
    Array.from(e.target.files).forEach(f => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      prev.appendChild(img);
    });
  });
}
setupPreview('pImage', 'pPreview');
setupPreview('galImages', 'galPreview');

/* ---- API ---- */
async function req(url, opts) {
  const r = await fetch(url, opts);
  return r.json().catch(() => ({}));
}

/* ======== PRODUCTS ======== */
async function loadProducts() {
  const products = await req('/api/products');
  const list = document.getElementById('productList');
  if (!products.length) { list.innerHTML = '<p style="color:var(--muted)">No products yet.</p>'; return; }
  list.innerHTML = products.map(p => `
    <div class="item-row">
      <img src="${p.imageUrl}" class="item-thumb" onerror="this.style.background='#fce7f3'">
      <div class="item-info">
        <strong>${p.name}</strong>
        <span>₹${p.price} • ${p.category}${p.eggless ? ' • 🌿 Eggless' : ''}</span>
      </div>
      <button class="btn btn-danger" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
    </div>
  `).join('');
}

async function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  await req(`/api/products/${id}`, { method: 'DELETE' });
  toast('Product deleted'); loadProducts();
}

document.getElementById('addProductBtn').addEventListener('click', async () => {
  const name = document.getElementById('pName').value.trim();
  const price = document.getElementById('pPrice').value;
  if (!name || !price) { toast('Name and price are required', 'error'); return; }

  const fd = new FormData();
  fd.append('name', name);
  fd.append('price', price);
  fd.append('category', document.getElementById('pCategory').value);
  fd.append('eggless', document.getElementById('pEggless').value);
  fd.append('description', document.getElementById('pDesc').value);
  const img = document.getElementById('pImage').files[0];
  if (img) fd.append('image', img);

  const btn = document.getElementById('addProductBtn');
  btn.disabled = true; btn.textContent = 'Adding…';
  await req('/api/products', { method: 'POST', body: fd });
  toast('Product added!');
  btn.disabled = false; btn.textContent = '+ Add Product';
  document.getElementById('pName').value = '';
  document.getElementById('pPrice').value = '';
  document.getElementById('pDesc').value = '';
  document.getElementById('pImage').value = '';
  document.getElementById('pPreview').innerHTML = '';
  loadProducts();
});

/* ======== GALLERY ======== */
async function loadGalleryAdmin() {
  const items = await req('/api/gallery');
  const grid = document.getElementById('galleryList');
  if (!items.length) { grid.innerHTML = '<p style="color:var(--muted)">No images yet.</p>'; return; }
  grid.innerHTML = items.map(img => `
    <div class="admin-gal-item">
      <img src="${img.url}" onerror="this.style.display='none'">
      <button onclick="deleteGallery(${img.id})"><i class="fas fa-times"></i></button>
    </div>
  `).join('');
}

async function deleteGallery(id) {
  await req(`/api/gallery/${id}`, { method: 'DELETE' });
  toast('Image deleted'); loadGalleryAdmin();
}

document.getElementById('uploadGalBtn').addEventListener('click', async () => {
  const files = document.getElementById('galImages').files;
  if (!files.length) { toast('Select images first', 'error'); return; }
  const fd = new FormData();
  Array.from(files).forEach(f => fd.append('files', f));
  const btn = document.getElementById('uploadGalBtn');
  btn.disabled = true; btn.textContent = 'Uploading…';
  await req('/api/gallery', { method: 'POST', body: fd });
  toast(`${files.length} image(s) uploaded!`);
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload Photos';
  document.getElementById('galImages').value = '';
  document.getElementById('galPreview').innerHTML = '';
  loadGalleryAdmin();
});

/* ======== TODAY'S SPECIAL ======== */
async function loadToday() {
  const today = await req('/api/today');
  const prev = document.getElementById('todayPreview');
  if (today && today.name) {
    document.getElementById('tName').value = today.name;
    document.getElementById('tPrice').value = today.price;
    document.getElementById('tIngredients').value = today.ingredients?.join(', ') || '';
    prev.innerHTML = `<strong>Current:</strong> ${today.name} — ₹${today.price}`;
  } else {
    prev.innerHTML = 'No special set today.';
  }
}

document.getElementById('saveTodayBtn').addEventListener('click', async () => {
  const fd = new FormData();
  fd.append('name', document.getElementById('tName').value);
  fd.append('price', document.getElementById('tPrice').value);
  fd.append('ingredients', document.getElementById('tIngredients').value);
  const img = document.getElementById('tImage').files[0];
  if (img) fd.append('image', img);
  await req('/api/today', { method: 'POST', body: fd });
  toast("Today's special saved!"); loadToday();
});

document.getElementById('clearTodayBtn').addEventListener('click', async () => {
  if (!confirm("Clear today's special?")) return;
  await req('/api/today', { method: 'DELETE' });
  toast('Cleared'); loadToday();
});

/* ======== REVIEWS ======== */
async function loadReviewsAdmin() {
  const reviews = await req('/api/reviews');
  const list = document.getElementById('reviewList');
  if (!reviews.length) { list.innerHTML = '<p style="color:var(--muted)">No reviews yet.</p>'; return; }
  list.innerHTML = reviews.map(r => `
    <div class="item-row">
      <div class="item-info">
        <strong>${r.name} — ${'★'.repeat(r.rating)}</strong>
        <span>${r.message}</span>
      </div>
      <button class="btn btn-danger" onclick="deleteReview(${r.id})"><i class="fas fa-trash"></i></button>
    </div>
  `).join('');
}

async function deleteReview(id) {
  await req(`/api/reviews/${id}`, { method: 'DELETE' });
  toast('Review deleted'); loadReviewsAdmin();
}

/* ======== FLAVOURS ======== */
async function loadFlavours() {
  const flavours = await req('/api/flavours');
  const list = document.getElementById('flavourList');
  if (!flavours.length) { list.innerHTML = '<p style="color:var(--muted)">No flavours yet.</p>'; return; }
  list.innerHTML = flavours.map(f => `
    <div class="item-row">
      <div class="item-info">
        <strong>${f.name}</strong>
        <span>${f.category || '—'} • ${f.eggless ? '🌿 Eggless' : ''} ${f.extra_cost ? `• +₹${f.extra_cost}` : ''}</span>
      </div>
      <button class="btn btn-danger" onclick="deleteFlavour(${f.id})"><i class="fas fa-trash"></i></button>
    </div>
  `).join('');
}

async function deleteFlavour(id) {
  await req(`/api/flavours/${id}`, { method: 'DELETE' });
  toast('Flavour deleted'); loadFlavours();
}

document.getElementById('addFlavourBtn').addEventListener('click', async () => {
  const name = document.getElementById('fName').value.trim();
  if (!name) { toast('Enter a flavour name', 'error'); return; }
  await req('/api/flavours', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, category: document.getElementById('fCategory').value, eggless: document.getElementById('fEggless').value, extraCost: document.getElementById('fCost').value }),
  });
  toast('Flavour added!');
  document.getElementById('fName').value = '';
  loadFlavours();
});

/* ======== ABOUT ======== */
async function loadAboutAdmin() {
  const about = await req('/api/about');
  if (about) {
    document.getElementById('aTitle').value = about.title || '';
    document.getElementById('aDesc1').value = about.description || '';
    document.getElementById('aDesc2').value = about.description2 || '';
  }
}

document.getElementById('saveAboutBtn').addEventListener('click', async () => {
  await req('/api/about', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: document.getElementById('aTitle').value, description: document.getElementById('aDesc1').value, description2: document.getElementById('aDesc2').value }),
  });
  toast('About updated!');
});

/* ---- Init ---- */
loadProducts();
loadGalleryAdmin();
loadToday();
loadReviewsAdmin();
loadFlavours();
loadAboutAdmin();
</script>
</body>
</html>
